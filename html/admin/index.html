<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quản trị — nguyenthevan.com</title>
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="referrer" content="no-referrer">
<style>
  html, body { height: 100%; margin: 0; overflow: hidden; background: #16181d; }
  :root { --gg-warning-height: 25px; } /* đo thật lúc dựng trang này; đổi nếu Google đổi giao diện */
  .cms-viewport { position: fixed; inset: 0; overflow: hidden; }
  .cms-frame {
    position: absolute; left: 0; border: 0; display: block;
    top: calc(var(--gg-warning-height) * -1);
    width: 100%; height: calc(100% + var(--gg-warning-height));
  }
  .cms-status {
    position: fixed; inset: 0; z-index: 10;
    display: flex; align-items: center; justify-content: center;
    background: #16181d; color: #fff;
    font-family: "Segoe UI", Arial, sans-serif; text-align: center; padding: 24px;
  }
  .cms-status.hidden { display: none; }
  .cms-status a {
    display: inline-block; margin-top: 16px; padding: 10px 20px; border-radius: 6px;
    background: #c52100; color: #fff; text-decoration: none; font-weight: 600;
  }
  .cms-spinner {
    width: 36px; height: 36px; border: 3px solid rgba(255,255,255,.2);
    border-top-color: #c52100; border-radius: 50%; animation: cms-spin .7s linear infinite;
    margin: 0 auto 16px;
  }
  @keyframes cms-spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="cms-viewport">
  <iframe class="cms-frame" id="cms-frame" title="Quản trị nội dung"></iframe>
</div>

<div class="cms-status" id="cms-status">
  <div>
    <div class="cms-spinner" id="cms-spinner"></div>
    <p id="cms-status-text">Đang mở trang quản trị...</p>
    <a id="cms-fallback-link" href="#" style="display:none">Mở trang quản trị ở tab mới</a>
  </div>
</div>

<script>
  var CMS_URL = "https://script.google.com/macros/s/AKfycbz3TiD7SLNTdJ05Xuhd_90GcieZr1yuGGfpB4SYNb17kkAKB0SkOJO3pJ3Lqfu6X69P/exec";
  var frame = document.getElementById("cms-frame");
  var statusBox = document.getElementById("cms-status");
  var fallbackLink = document.getElementById("cms-fallback-link");
  var loaded = false;

  fallbackLink.href = CMS_URL;

  frame.addEventListener("load", function () {
    loaded = true;
    statusBox.classList.add("hidden");
  });

  setTimeout(function () {
    if (loaded) return;
    document.getElementById("cms-spinner").style.display = "none";
    document.getElementById("cms-status-text").textContent =
      "Không mở được trang quản trị trong khung này.";
    fallbackLink.style.display = "inline-block";
  }, 12000);

  frame.src = CMS_URL;
</script>

</body>
</html>
