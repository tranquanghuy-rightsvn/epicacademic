name: Build site from CMS data

on:
  push:
    branches: [master]
    paths:
      - "data/posts.json"
      - "data/categories.json"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build html/ from data/
        run: python3 scripts/build.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add html data/.build-manifest.json
          git diff --staged --quiet || (git commit -m "CI: build html from data" && git push)
